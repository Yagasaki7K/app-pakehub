name: Setup Pake Build Environment
description: Sets up Bun, Rust, and Pake CLI with caching

inputs:
  pake-version:
    description: Pake CLI version
    required: false
    default: 3.18.0

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache Bun packages
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-pake-cli-${{ inputs.pake-version }}-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          bun-pake-cli-${{ inputs.pake-version }}-${{ runner.os }}-
          bun-pake-cli-

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
